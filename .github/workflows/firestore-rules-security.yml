name: Spades Firestore Rules Security Tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore.rules.test.js'
      - 'package.json'
      - '.github/workflows/firestore-rules-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore rules emulator tests
        run: npm run test:rules
